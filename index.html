<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Calculadora de Impressão 3D</title>
<style>body{font:16px Arial;background:#f4f7fb;margin:25px;color:#172033}main{max-width:900px;margin:auto}.box{background:white;padding:18px;margin:12px 0;border-radius:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{display:block;margin:8px 0 4px;font-weight:bold}input,select{width:100%;padding:9px;box-sizing:border-box;border:1px solid #bbb;border-radius:6px}button{padding:12px 20px;background:#2563eb;color:white;border:0;border-radius:7px;font-weight:bold}.result{font-size:20px;font-weight:bold}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style>
</head>
<body><main><h1>Calculadora de lucro na impressão 3D</h1>
<div class="box"><h2>Produção e venda</h2><div class="grid"><div><label>Horas de impressão</label><input id="h" type="number" value="5" step="0.01"></div><div><label>Peças por mesa</label><input id="q" type="number" value="4"></div><div><label>Preço atual por peça (R$)</label><input id="p" type="number" value="29.90" step="0.01"></div><div><label>Canal</label><select id="channel"><option value="0">Site próprio</option><option value="20">Shopee</option><option value="17">Mercado Livre</option></select></div><div><label>Taxa do canal (%) editável</label><input id="fee" type="number" value="0" step="0.01"></div><div><label>Margem desejada (%)</label><input id="margin" type="number" value="30" step="0.01"></div></div></div>
<div class="box"><h2>Custos da mesa/ciclo</h2><div class="grid"><div><label>Filamento total usado (g)</label><input id="g" type="number" value="160" step="0.1"></div><div><label>Preço do filamento (R$/kg)</label><input id="kg" type="number" value="95" step="0.01"></div><div><label>Embalagem total (R$)</label><input id="pack" type="number" value="6" step="0.01"></div><div><label>Outros custos totais (R$)</label><input id="other" type="number" value="0" step="0.01"></div><div><label>Mão de obra por peça (R$)</label><input id="labor" type="number" value="2" step="0.01"></div><div><label>Bambu Lab A1 — potência média (W)</label><input id="w" type="number" value="120"></div><div><label>Energia (R$/kWh)</label><input id="kwh" type="number" value="0.95" step="0.01"></div><div><label>Máquina/manutenção por hora (R$)</label><input id="machine" type="number" value="2" step="0.01"></div></div></div>
<div class="box"><button id="go">Calcular</button><h2>Resultado</h2><p>Preço mínimo sem prejuízo: <span class="result" id="min">—</span></p><p>Preço ideal com margem: <span class="result" id="ideal">—</span></p><p>Lucro por peça no preço atual: <span class="result" id="profit">—</span></p><p>Lucro por hora no preço atual: <span class="result" id="hour">—</span></p></div></main>
<script>const $=id=>document.getElementById(id),n=id=>Number($(id).value)||0,money=v=>v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});function calc(){let q=n('q'),h=n('h'),fee=n('fee')/100,material=n('g')/1000*n('kg'),energy=n('w')/1000*n('kwh')*h,machine=n('machine')*h,base=(material+n('pack')+n('other')+(n('labor')*q)+energy+machine)/q,min=base/(1-fee),ideal=base/(1-fee-n('margin')/100),profit=n('p')*(1-fee)-base,hour=profit*q/h;$('min').textContent=money(min);$('ideal').textContent=money(ideal);$('profit').textContent=money(profit);$('hour').textContent=money(hour)}$('channel').onchange=()=>{$('fee').value=$('channel').value;calc()};$('go').onclick=calc;calc();</script></body></html>
