<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Calculadora de lucro — Impressão 3D</title><style>body{font:15px system-ui;margin:30px;background:#f4f7fb;color:#162033}main{max-width:1050px;margin:auto}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.card{background:white;padding:20px;border:1px solid #d9e0ea;border-radius:14px}.wide{grid-column:1/-1}.row,.results{display:grid;grid-template-columns:1fr 1fr;gap:12px}.results{grid-template-columns:repeat(4,1fr)}label{display:block;font-weight:600;margin:10px 0 4px}input,select{width:100%;padding:10px;box-sizing:border-box;border:1px solid #c9d2df;border-radius:8px}button{padding:11px 18px;background:#2563eb;color:white;border:0;border-radius:8px;font-weight:700;cursor:pointer}.metric{padding:14px;border:1px solid #d9e0ea;border-radius:10px}.metric span{display:block;color:#667085}.metric strong{display:block;font-size:22px;margin-top:5px}.ok{color:#087443}.bad{color:#b42318}.breakdown{margin-top:16px}.breakdown div{display:flex;justify-content:space-between;padding:6px;border-bottom:1px dashed #ddd}@media(max-width:700px){.grid,.row,.results{grid-template-columns:1fr}}</style><main><h1>Calculadora de lucro na impressão 3D</h1><p>Informe os dados e clique em calcular.</p><div class="grid"><section class="card"><h2>Produção e venda</h2><div class="row"><div><label>Horas de impressão</label><input id="hours" type="number" value="5" step="0.01"></div><div><label>Peças por mesa</label><input id="qty" type="number" value="4"></div></div><div class="row"><div><label>Preço de venda por peça (R$)</label><input id="price" type="number" value="29.90" step="0.01"></div><div><label>Canal</label><select id="channel"><option value="0">Site próprio</option><option value="20">Shopee</option><option value="17">Mercado Livre</option></select></div></div><label>Taxa de pagamento (%)</label><input id="payment" type="number" value="0" step="0.01"></section><section class="card"><h2>Custos por peça</h2><div class="row"><div><label>Filamento por peça (g)</label><input id="grams" type="number" value="40" step="0.1"></div><div><label>Filamento (R$/kg)</label><input id="filament" type="number" value="95" step="0.01"></div></div><div class="row"><div><label>Embalagem (R$)</label><input id="pack" type="number" value="1.5" step="0.01"></div><div><label>Outros custos (R$)</label><input id="other" type="number" value="0" step="0.01"></div></div><label>Mão de obra (R$)</label><input id="labor" type="number" value="2" step="0.01"></section><section class="card"><h2>Custos da máquina</h2><div class="row"><div><label>Potência (W)</label><input id="power" type="number" value="120"></div><div><label>Energia (R$/kWh)</label><input id="kwh" type="number" value="0.95" step="0.01"></div></div><div class="row"><div><label>Depreciação/manutenção por hora (R$)</label><input id="machine" type="number" value="2" step="0.01"></div><div><label>Tempo extra (h)</label><input id="setup" type="number" value="0.25" step="0.01"></div></div></section><section class="card wide"><button id="go" type="button">Calcular resultado</button><h2>Resultado</h2><div class="results"><div class="metric">Lucro por peça<strong id="unit">—</strong></div><div class="metric">Lucro por ciclo<strong id="cycle">—</strong></div><div class="metric">Lucro por hora<strong id="hour">—</strong></div><div class="metric">Margem<strong id="margin">—</strong></div></div><div class="breakdown" id="breakdown"></div></section></div></main><script>function n(id){return Number(document.getElementById(id).value)||0}function money(x){return x.toLocaleString("pt-BR",{style:"currency",currency:"BRL"})}function calc(){var h=n("hours"),q=n("qty"),p=n("price"),fee=n("channel")/100,pay=n("payment")/100,mat=n("grams")/1000*n("filament"),energy=n("power")/1000*n("kwh")*h,machine=n("machine")*h,direct=mat+n("pack")+n("other")+n("labor"),unit=p-p*fee-p*pay-direct-(q?(energy+machine)/q:0),cycle=unit*q,hour=cycle/(h+n("setup"));document.getElementById("unit").textContent=money(unit);document.getElementById("cycle").textContent=money(cycle);document.getElementById("hour").textContent=money(hour);document.getElementById("margin").textContent=(p?unit/p*100:0).toLocaleString("pt-BR",{maximumFractionDigits:2})+"%";document.getElementById("breakdown").innerHTML="<div><span>Filamento por peça</span><b>"+money(mat)+"</b></div><div><span>Energia por ciclo</span><b>"+money(energy)+"</b></div><div><span>Máquina por ciclo</span><b>"+money(machine)+"</b></div>"}document.getElementById("go").addEventListener("click",calc);calc();</script>
